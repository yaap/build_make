[package]
name = "aconfig"
version = "0.1.0"
edition = "2021"

[features]
default = ["cargo"]
cargo = []
default_exported_reads_to_disabled = []
generate_checks_sdk_annotation = []

[dependencies]
anyhow = { path = "../../../../../external/rust/android-crates-io/crates/anyhow" }
clap = { path = "../../../../../external/rust/android-crates-io/crates/clap", features = ["derive", "string"] }
itertools = "0.10.5"
protobuf = "3.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
tinytemplate = "1.2.1"
lazy_static = "1.5.0"
aconfig_protos = { path = "../aconfig_protos" }
aconfig_storage_file = { path = "../aconfig_storage_file", features = ["test_utils"] }
convert_finalized_flags = { path = "../convert_finalized_flags" }
walkdir = "2.5.0"

[build-dependencies]
anyhow = { path = "../../../../../external/rust/android-crates-io/crates/anyhow" }
itertools = "0.10.5"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
convert_finalized_flags = { path = "../convert_finalized_flags" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(enable_fingerprint_rust)",
    "cfg(enable_fingerprint_cpp)",
    "cfg(enable_jarjar_flags_in_framwork)",
    "cfg(enable_parse_v4)",
    "cfg(optimize_read_only_java)",
    "cfg(default_allow_java_impl_interface_removal)",
]
